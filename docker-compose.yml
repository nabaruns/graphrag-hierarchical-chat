services:
  neo4j:
    image: neo4j:5.24-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: graphrag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: graphrag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Start the server, pull the model on first boot, then keep serving.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        pid=$!
        echo "Waiting for Ollama to be ready..."
        until ollama list >/dev/null 2>&1; do sleep 1; done
        echo "Pulling model ${OLLAMA_MODEL:-qwen2.5:3b-instruct}..."
        ollama pull ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
        wait $pid
    healthcheck:
      # Healthy only once the model has been pulled and is listed.
      test: ["CMD-SHELL", "ollama list | grep -q ${OLLAMA_MODEL:-qwen2.5:3b-instruct} || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 30s

  api:
    build: ./backend
    container_name: graphrag-api
    ports:
      - "8000:8000"
    environment:
      OPENAI_BASE_URL: http://ollama:11434/v1
      OPENAI_API_KEY: ollama
      LLM_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      QDRANT_URL: http://qdrant:6333
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: graphrag-web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  neo4j_data:
  qdrant_data:
  ollama_data:
