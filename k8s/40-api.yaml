apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: graphrag
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/graphrag-explorer-api:latest # build & push your image
          ports:
            - { containerPort: 8000 }
          env:
            # Point the OpenAI-compatible client at the in-cluster vLLM service.
            - { name: OPENAI_BASE_URL, value: "http://vllm-service:8000/v1" }
            - { name: OPENAI_API_KEY, value: "not-needed" }
            - { name: LLM_MODEL, value: "Qwen/Qwen2.5-7B-Instruct" }
            - { name: NEO4J_URI, value: "bolt://neo4j:7687" }
            - { name: NEO4J_USER, value: "neo4j" }
            - { name: NEO4J_PASSWORD, value: "password123" }
            - { name: QDRANT_URL, value: "http://qdrant:6333" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: graphrag
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
