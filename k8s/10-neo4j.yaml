apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: graphrag
spec:
  replicas: 1
  selector:
    matchLabels: { app: neo4j }
  template:
    metadata:
      labels: { app: neo4j }
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.24-community
          ports:
            - { containerPort: 7474 }
            - { containerPort: 7687 }
          env:
            - { name: NEO4J_AUTH, value: "neo4j/password123" }
            - { name: NEO4J_PLUGINS, value: '["apoc"]' }
            - { name: NEO4J_dbms_security_procedures_unrestricted, value: "apoc.*" }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}   # swap for a PersistentVolumeClaim in production
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: graphrag
spec:
  selector: { app: neo4j }
  ports:
    - { name: http, port: 7474, targetPort: 7474 }
    - { name: bolt, port: 7687, targetPort: 7687 }
